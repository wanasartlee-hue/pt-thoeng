<style>
/* Layout: purple header band with a yellow rule, two "pages" (learner / staff) switched by tabs; forms sit on white sheets over a pale lilac ground. Single light look by request (purple–yellow–white). */
:root{
  color-scheme: light;
  --plum:#3d1d69; --violet:#6a3ea1; --lilac:#f3eefa; --line:#ddd2ec; --mist:#faf8fd;
  --gold:#f4b400; --butter:#fff5d1; --ink:#22183a; --muted:#6c6283; --white:#ffffff;
  --ok:#1f7a4d; --okbg:#e3f4ea; --warn:#9a6200; --bad:#b3261e; --badbg:#fbe7e5;
  --f-display:"K2D",Tahoma,system-ui,sans-serif;
  --f-ui:"K2D",Tahoma,system-ui,sans-serif;
  --f-doc:"DocSarabun",Tahoma,sans-serif;
  --r:10px;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--lilac);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--plum)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--plum);color:var(--white);border-bottom:4px solid var(--gold);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;flex:1 1 260px;min-width:0}
.seal{width:50px;height:50px;border-radius:50%;background:var(--gold);color:var(--plum);display:grid;place-items:center;font-family:var(--f-display);font-weight:500;font-size:14px;flex:none;overflow:hidden}
.seal img{width:100%;height:100%;object-fit:cover;background:#fff}
.brand b{font-family:var(--f-display);font-weight:500;font-size:18px;display:block;line-height:1.3}
.brand small{color:#d9cdef;font-size:12.5px}
.pageswitch{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:4px;gap:4px}
.pageswitch a{color:var(--white);text-decoration:none;padding:6px 16px;border-radius:999px;font-weight:500;font-size:14px}
.pageswitch a.on{background:var(--gold);color:var(--plum)}
.pageswitch a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{padding-block:24px 64px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;color:var(--plum)}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16.5px}
p{margin:0}
.muted{color:var(--muted)}
.hero{display:grid;gap:6px;margin-bottom:18px}
.banner{background:var(--butter);border:1px solid #f0d98a;color:#5b4300;border-radius:var(--r);padding:10px 14px;font-size:14px;margin-bottom:16px}
.sheet{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:grid;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>*{min-width:0}
.grid{display:grid;gap:12px 14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.grid.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
label.f{display:grid;gap:4px;font-size:13.5px;color:var(--muted);font-weight:500}
label.f.wide{grid-column:1/-1}
input,select,textarea{font:inherit;color:var(--ink);background:var(--white);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--violet);outline-offset:0;border-color:var(--violet)}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-family:var(--f-display);color:var(--plum);font-size:15.5px;padding:0;margin-bottom:6px}
.sec{border-top:1px dashed var(--line);padding-top:16px;display:grid;gap:12px}
.sec:first-child{border-top:0;padding-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--mist);cursor:pointer;font-size:14px;user-select:none}
.chip input{width:auto;margin:0;accent-color:var(--violet)}
.chip:has(input:checked){background:var(--lilac);border-color:var(--violet);color:var(--plum)}
.btn{font:inherit;font-weight:500;border:1px solid transparent;border-radius:8px;padding:8px 16px;cursor:pointer;background:var(--violet);color:var(--white);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--plum)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.gold{background:var(--gold);color:var(--plum)} .btn.gold:hover{background:#e2a500}
.btn.ghost{background:var(--white);color:var(--plum);border-color:var(--line)} .btn.ghost:hover{background:var(--lilac)}
.btn.danger{background:var(--white);color:var(--bad);border-color:#efc2bd} .btn.danger.arm{background:var(--bad);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.formtabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.formtabs button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--white);color:var(--ink);border-radius:var(--r);padding:8px 14px;text-align:left;display:grid;line-height:1.35}
.formtabs button b{font-family:var(--f-display);font-weight:500;color:var(--violet);font-size:13px}
.formtabs button.on{border-color:var(--plum);background:var(--plum);color:var(--white)}
.formtabs button.on b{color:var(--gold)}
.formhead{display:grid;gap:2px;text-align:center;border-bottom:2px solid var(--gold);padding-bottom:12px;position:relative}
.formhead .fno{position:absolute;right:0;top:0;font-weight:700;color:var(--plum);background:var(--butter);border:1px solid #f0d98a;border-radius:6px;padding:0 10px;font-size:13.5px}
.formhead h2{font-size:19px;padding:0 90px}
.formhead p{color:var(--muted);font-size:13.5px}
.note{font-size:13px;color:var(--muted);background:var(--mist);border-radius:8px;padding:8px 12px}
@media (max-width:560px){.formhead h2{padding:22px 0 0}}
.coursecard{background:var(--butter);border:1px solid #f0d98a;border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;font-size:14px}
.tabs{position:relative;display:flex;gap:2px;overflow-x:auto;scroll-behavior:auto;border-bottom:2px solid var(--line);margin-bottom:16px}
.tabs button{font:inherit;border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--plum);border-bottom-color:var(--gold)}
.tabs button{position:relative}
.tabs button+button::before{content:"";position:absolute;left:-1px;top:20%;height:60%;width:2px;border-radius:2px;background:var(--gold)}
.pw{position:relative;display:block}
.pw input{padding-right:46px}
.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:6px;display:grid;place-items:center}
.pw button:hover{color:var(--plum);background:var(--lilac)}

async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

/* ================= store: Firestore, or this-browser demo when Firebase is not set ================= */
const S={mode:'loading',F:null,fs:null,auth:null,user:null,mem:{},fbError:false,
  async init(){
    this.demoAsked=new URLSearchParams(location.search).has('demo');
    if(!this.demoAsked&&FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.projectId){
      try{
        const [a,f,u]=await Promise.all([import(FB_SDK+'firebase-app.js'),import(FB_SDK+'firebase-firestore.js'),import(FB_SDK+'firebase-auth.js')]);
        this.F={...a,...f,...u};this.app=a.initializeApp(FIREBASE_CONFIG);this.fs=f.getFirestore(this.app);this.auth=u.getAuth(this.app);
        this.user=await new Promise(r=>{const off=u.onAuthStateChanged(this.auth,x=>{off();r(x)})});
        this.mode='fb';return;
      }catch(e){console.error(e);this.fbError=true}
    }
    this.mode='local';try{this.mem=JSON.parse(localStorage.getItem(DEMO_KEY)||'{}')}catch(e){this.mem={}}if(!this.mem['meta/demo'])this.mem={},demoSeed(this.mem),this._save();
  },
  _save(){try{localStorage.setItem(DEMO_KEY,JSON.stringify(this.mem))}catch(e){}},
  ref(p){return this.F.doc(this.fs,p)},
  async get(p){if(this.mode==='fb'){const x=await this.F.getDoc(this.ref(p));return x.exists()?{id:x.id,...x.data()}:null}const v=this.mem[p];return v?{id:p.split('/').pop(),...v}:null},
  async list(c,w){
    if(this.mode==='fb'){const F=this.F,col=F.collection(this.fs,c);const q=w?F.query(col,F.where(w[0],'==',w[1])):col;const x=await F.getDocs(q);return x.docs.map(d=>({id:d.id,...d.data()}))}
    const pre=c+'/';let r=Object.keys(this.mem).filter(k=>k.startsWith(pre)&&!k.slice(pre.length).includes('/')).map(k=>({id:k.slice(pre.length),...this.mem[k]}));
    return w?r.filter(x=>x[w[0]]===w[1]):r},
  async set(p,d){d=strip(d);if(this.mode==='fb')return this.F.setDoc(this.ref(p),d);this.mem[p]=d;this._save()},
  async update(p,d){d=strip(d);if(this.mode==='fb')return this.F.updateDoc(this.ref(p),d);this.mem[p]={...(this.mem[p]||{}),...d};this._save()},
  async del(p){if(this.mode==='fb')return this.F.deleteDoc(this.ref(p));delete this.mem[p];this._save()},
  async merge(p,d){d=strip(d);if(this.mode==='fb')return this.F.setDoc(this.ref(p),d,{merge:true});const cur=this.mem[p]||{};this.mem[p]={...cur,...d,items:{...(cur.items||{}),...(d.items||{})}};this._save()},
  watch(c,w,cb){if(this.mode!=='fb')return()=>{};const F=this.F,col=F.collection(this.fs,c);const q=w?F.query(col,F.where(w[0],'==',w[1])):col;return F.onSnapshot(q,x=>cb(x.docs.map(d=>({id:d.id,...d.data()}))),e=>console.warn('watch',c,e))},
  async add(c,d){d=strip(d);if(this.mode==='fb'){const r=await this.F.addDoc(this.F.collection(this.fs,c),d);return r.id}const id=newId();this.mem[c+'/'+id]=d;this._save();return id},
  // accounts (Firebase Authentication, email + password where the password is the phone number)
  async signIn(email,pw){return this.F.signInWithEmailAndPassword(this.auth,email,pw)},
  async signOut(){if(this.mode==='fb')await this.F.signOut(this.auth)},
  async createOwn(email,pw){const c=await this.F.createUserWithEmailAndPassword(this.auth,email,pw);return c.user.uid},
  async createOther(email,pw){ // a second app instance, so the admin stays signed in
    const F=this.F,app2=F.initializeApp(FIREBASE_CONFIG,'creator-'+newId());
    try{const a2=F.getAuth(app2);const c=await F.createUserWithEmailAndPassword(a2,email,pw);await F.signOut(a2);return c.user.uid}
    finally{try{await F.deleteApp(app2)}catch(e){}}
  }
};
const loginKey=async name=>(await sha('n|'+String(name||'').trim())).slice(0,40);
const newLoginEmail=()=>'u'+newId()+Math.random().toString(36).slice(2,8)+'@'+LOGIN_DOMAIN;
async function createLogin(first,phone){const email=newLoginEmail();const uid=await S.createOther(email,phone);await S.set('logins/'+await loginKey(first),{email});return{uid,email}}

const learnerTabs=()=>{const L=st.lc;return `<div class="formtabs" role="tablist">${Object.entries(FORMS).map(([k,f])=>`<button type="button" role="tab" data-form="${k}" class="${k===L.form?'on':''}" aria-selected="${k===L.form}"><b>แบบ ${f.no}</b>${f.t}</button>`).join('')}<button type="button" role="tab" data-form="cert" class="${L.form==='cert'?'on':''}" aria-selected="${L.form==='cert'}"><b>วุฒิบัตร</b>ค้นหาใบรับรองของฉัน</button></div>`};
function certItem(c,a,i){const cn=cname(c.center),pl=c.place?(c.place.includes(cn)?c.place:c.place+' '+cn):cn;return{name:fullName(a),certNo:certNo(c,i),course:c.name,hours:c.hours,startDate:c.startDate,endDate:c.endDate||c.startDate,center:cn,place:pl}}
const idDigits=v=>String(v||'').replace(/\D/g,'');
async function findCerts(d){
  if(S.mode==='fb'){const x=await S.get('certs/'+await sha('c|'+d));return x?Object.values(x.items||{}).filter(Boolean):[]}
  const all=(await S.list('subs')).map(it=>({...it,_key:it.id})).sort((a,b)=>(a.at||0)-(b.at||0)),out=[];
  for(const a of all.filter(s=>s.type==='pt2'&&idDigits(s.idcard)===d)){const c=st.courses.find(x=>x.id===a.courseId);if(!c||!(c.approval||{}).supervisor)continue;
    const ps=all.filter(s=>s.type==='pt2'&&s.courseId===c.id&&((c.evals||{})[s._key]||{}).pass);const i=ps.findIndex(s=>s._key===a._key);if(i>=0)out.push(certItem(c,a,i))}
  return out;
}
async function publishCerts(c){const ps=passedOf(c);let n=0;for(let i=0;i<ps.length;i++){const d=idDigits(ps[i].idcard);if(d.length<6)continue;await S.merge('certs/'+await sha('c|'+d),{items:{[c.id]:certItem(c,ps[i],i)}});n++}return n}
async function unpublishCerts(c){for(const a of appsOf(c)){const d=idDigits(a.idcard);if(d.length<6)continue;await S.merge('certs/'+await sha('c|'+d),{items:{[c.id]:null}})}}

async function submitLearner(e){
  e.preventDefault();const f=e.target,L=st.lc;
  if(!f.checkValidity()){f.reportValidity();return}
  if(L.form==='pt2'&&!/^[0-9A-Za-z-]{6,20}$/.test(f.elements.idcard.value.replace(/\s/g,''))){toast('เลขบัตรประชาชนไม่ถูกต้อง');return}
  const c=st.courses.find(x=>x.id===L.course);
  const d={type:L.form,center:L.center,courseId:L.course||'',courseName:c?c.name:'',at:Date.now(),...readForm(f)};
  const btn=f.querySelector('[type=submit]');btn.disabled=true;$('#lmsg').textContent='กำลังส่ง…';
  try{const id=await S.add('subs',d);
    const F=FORMS[L.form];
    $('#lbody').innerHTML=`<div class="empty" style="background:var(--okbg);border-color:#b9dfc8;color:var(--ok)"><h2 style="color:var(--ok)">ส่งแบบ ${F.no} เรียบร้อยแล้ว</h2><p>ขอบคุณ ${esc(fullName(d)||'')} ข้อมูลถึงครูประจำ${esc(d.center)}แล้ว</p></div>

function setMe(m){st.me={id:m.id,title:m.title,first:m.first,last:m.last,role:m.role,center:m.center||''};try{sessionStorage.setItem('pt-me',JSON.stringify(st.me))}catch(e){}st.staffLoaded=false;renderStaff()}

const inboxLabel=()=>`แบบที่ผู้เรียนส่งมา (${['pt1','pt2','pt12','pt20'].reduce((n,t)=>n+visSubs(t).length,0)})`;
/* realtime: new forms and course changes appear without refreshing */
function startWatch(){
  if(st.unsub||S.mode!=='fb'||!st.me)return;let firstS=true,firstC=true;
  st.unsub=[
    S.watch('subs',isAll()?null:['center',st.me.center],L=>{const old=new Set(st.subs.map(x=>x.id));const added=L.filter(x=>!old.has(x.id)).length;
      st.subs=L.map(it=>({...it,_key:it.id,_path:'subs/'+it.id})).sort((a,b)=>(a.at||0)-(b.at||0));
      if(!firstS&&added)toast(`มีแบบใหม่เข้ามา ${added} รายการ`);firstS=false;liveRefresh()}),
    S.watch('courses',null,L=>{st.courses=L.sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||''));if(!firstC)liveRefresh();firstC=false})];
}
function stopWatch(){(st.unsub||[]).forEach(f=>{try{f()}catch(e){}});st.unsub=null}
function liveRefresh(){
  if(st.page!=='staff'||!st.me||!st.staffLoaded)return;
  const tb=$('.tabs [data-tab=inbox]');if(tb)tb.textContent=inboxLabel();
  if(st.editCourse||st.editUser||!$('#modal').hidden||['pt10','pt13','settings','users'].includes(st.tab))return; // don't disturb a form being filled
  const y=window.scrollY;renderStaff().then(()=>window.scrollTo(0,y));
}
const visCourses=()=>st.courses.filter(c=>fyOf(c)===st.fy&&(isAll()?(!st.centerF||c.center===st.centerF):c.center===st.me.center));
const subFy=s=>{if(s.courseId){const c=st.courses.find(x=>x.id===s.courseId);if(c)return fyOf(c)}return fyOfDate(s.at)};
const visSubs=t=>st.subs.filter(s=>s.type===t&&subFy(s)===st.fy&&(isAll()?(!st.centerF||s.center===st.centerF):s.center===st.me.center));
const appsOf=c=>st.subs.filter(s=>s.type==='pt2'&&s.courseId===c.id);
const evalOf=(c,a)=>(c.evals||{})[a._key]||{};

const itemMean=(L,i)=>{const v=L.map(s=>num(s['r'+i])).filter(Boolean);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0};
const satMean=L=>{const v=[];L.forEach(s=>{for(let i=1;i<=16;i++){const x=num(s['r'+i]);if(x)v.push(x)}});return v.length?v.reduce((a,b)=>a+b,0)/v.length:0};
const satLevel=m=>!m?'-':m>=4.51?'มากที่สุด':m>=3.51?'มาก':m>=2.51?'ปานกลาง':m>=1.51?'น้อย':'น้อยที่สุด';

async function syncCenters(){const list=[...new Set([...st.staff].sort((a,b)=>(a.order||999)-(b.order||999)).filter(s=>s.role==='teacher'&&s.center).map(s=>s.center.trim()))];const teachers={},positions={};st.staff.forEach(s=>{const k=(s.center||'').trim();if(s.role==='teacher'&&k&&!teachers[k]){teachers[k]=`${s.title||''}${s.first||''} ${s.last||''}`.trim();positions[k]=jobOf(s)}});await S.set('meta/centers',{list,teachers,positions});st.centers=list;st.cteach=teachers;st.cpos=positions}
function roleFromPos(p){p=String(p||'').trim();if(p==='แอดมิน')return['admin',''];if(['ผู้อำนวยการ','ครู','หัวหน้างาน'].includes(p))return['supervisor',''];return['teacher',p]}
async function importExcel(file){
  if(!window.XLSX){toast('โหลดตัวอ่าน Excel ไม่สำเร็จ');return}
  const wb=XLSX.read(await file.arrayBuffer());const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
  const hi=rows.findIndex(r=>r.some(c=>String(c).trim()==='ชื่อ')&&r.some(c=>String(c).trim()==='ตำบล'));
  if(hi<0){toast('ไม่พบหัวตาราง “ชื่อ” และ “ตำบล” ในไฟล์');return}
  const H=rows[hi].map(c=>String(c).trim()),ix=n=>H.indexOf(n);let n=0,order=0;
  for(const r of rows.slice(hi+1)){const first=String(r[ix('ชื่อ')]||'').trim();if(!first)continue;order++;
    const pos=String(r[ix('ตำบล')]||'').trim(),[role,center]=roleFromPos(pos);
    const old=st.staff.find(s=>(s.first||'').trim()===first)||{};
    const d={...old,order,title:String(r[ix('คำนำหน้า')]||'').trim(),first,last:String(r[ix('สกุล')]||'').trim(),email:String(r[ix('E-mail')]||'').trim(),role,center,position:pos};
    let ph=String(r[ix('เบอร์โทร')]||'').replace(/\D/g,'');if(ph.length===9)ph='0'+ph;
    if(S.mode==='fb'){
      if(old.id===st.me.id){d.role=old.role} // never replace or demote the signed-in admin
      else if(ph&&ph.length>=6&&(!old.id||old.id.startsWith('nologin-')||old.ph4!==ph.slice(-4))){toast(`กำลังสร้างบัญชี ${first} …`);const L=await createLogin(first,ph);d.id=L.uid;d.loginEmail=L.email;d.ph4=ph.slice(-4)}
      else if(!d.id)d.id='nologin-'+newId();
    }else{if(ph){d.ph=await phHash(ph);d.ph4=ph.slice(-4)}if(!d.id)d.id=newId()}
    await S.set('staff/'+d.id,d);if(old.id&&old.id!==d.id)await S.del('staff/'+old.id);
    st.staff=st.staff.filter(x=>x.id!==old.id&&x.id!==d.id);st.staff.push(d);n++}
  st.staff.sort((a,b)=>(a.order||999)-(b.order||999));await syncCenters();toast(`นำเข้า ${n} คน และศูนย์การเรียนรู้ ${st.centers.length} แห่งแล้ว`);renderStaff();
}

  if(!land){const el=$('#docel');(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(()=>{try{paginate(el)}catch(e){console.warn(e)}}))}
}
/* Split long tables at page ends and repeat their header rows; explicit .pbreak markers start a new page.
   Page = A4 minus 20 mm top/bottom margins = 257 mm = 971 px at the document's 96 dpi scale. */
function paginate(root){
  const PH=971,top=el=>el.getBoundingClientRect().top-root.getBoundingClientRect().top;
  const fill=sp=>{sp.style.height='0px';const r=top(sp)%PH;sp.style.height=(r>1?PH-r-1:0)+'px'};
  const spacer=()=>{const d=document.createElement('div');d.className='html2pdf__page-break pbr';return d};
  for(const it of [...root.querySelectorAll('.pbreak, table.rep')]){
    if(it.classList.contains('pbreak')){it.classList.add('html2pdf__page-break','pbr');fill(it);continue}
    let t=it,guard=0;
    while(t&&guard++<80){
      const rows=[...(t.tBodies[0]||{rows:[]}).rows];if(!rows.length)break;
      const head=t.tHead?t.tHead.getBoundingClientRect().height:0;let acc=top(t)%PH+head,cut=-1;
      for(let i=0;i<rows.length;i++){const h=rows[i].getBoundingClientRect().height;if(acc+h>PH-2){cut=i;break}acc+=h}
      if(cut<0)break;
      const sp=spacer();
      if(cut===0){if(top(t)%PH<4)break;t.before(sp);fill(sp);continue}
      const nt=t.cloneNode(false),cg=t.querySelector('colgroup');if(cg)nt.appendChild(cg.cloneNode(true));if(t.tHead)nt.appendChild(t.tHead.cloneNode(true));
      const nb=document.createElement('tbody');nt.appendChild(nb);rows.slice(cut).forEach(r=>nb.appendChild(r));
      t.after(sp);sp.after(nt);fill(sp);t=nt;
    }
  }
}

/* html2canvas cannot find line breaks inside Thai text (no spaces), so mark word boundaries with zero-width spaces in the copy it draws */
function thaiBreak(root){if(!(window.Intl&&Intl.Segmenter))return;const seg=new Intl.Segmenter('th',{granularity:'word'});const w=root.ownerDocument.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);
  for(const n of ns){if(/[฀-๿]/.test(n.data))n.data=[...seg.segment(n.data)].map(x=>x.segment).join('​')}}

};
